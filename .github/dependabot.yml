version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-runtime:
        patterns:
          - "firebase"
          - "react"
          - "react-dom"
          - "motion"
          - "lucide-react"
      web-tooling:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "@tailwindcss/*"
          - "tailwindcss"
          - "typescript"
          - "tsx"
          - "esbuild"
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      firebase-functions:
        patterns:
          - "firebase-admin"
          - "firebase-functions"
    labels:
      - dependencies
