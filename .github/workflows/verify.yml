name: Verify Inkbound

on:
  push:
    branches:
      - design/quiet-shelf-dashboard
      - feature/series-library
      - feature/build-27-reading-source-of-truth
      - feature/build-28-library-building
      - feature/build-29-social
      - main
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build-only CI fixtures. Production deploys still require real values from the
  # ignored deployment environment; these values are only present on Actions runners.
  VITE_FIREBASE_API_KEY: ci-firebase-api-key
  VITE_FIREBASE_AUTH_DOMAIN: inkbound-ci.invalid
  VITE_FIREBASE_PROJECT_ID: inkbound-app
  VITE_FIREBASE_STORAGE_BUCKET: inkbound-app.appspot.com
  VITE_FIREBASE_MESSAGING_SENDER_ID: '100000000001'
  VITE_FIREBASE_APP_ID: '1:100000000001:web:ciinkboundbuild'
  VITE_GOOGLE_BOOKS_API_KEY: ci-google-books-key
  VITE_FIREBASE_APP_CHECK_SITE_KEY: ci-app-check-site-key

jobs:
  verify-shared:
    name: Shared app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Critical reading regressions
        run: npm run test:critical

      - name: Series Detective integration regressions
        run: npm run test:series:integration

      - name: Book Details compact layout contracts
        run: npm run test:book-details:layout

      - name: Verify source-of-truth boundaries
        run: npm run verify:source-of-truth

      - name: Verify web/Android feature parity
        run: npm run verify:parity

      - name: Production build
        run: npm run build

      - name: Verify public release artifacts
        run: npm run verify:release-artifacts

      - name: Verify callable security boundaries
        run: npm run verify:function-security

      - name: Verify Android shared configuration
        run: npm run verify:android-config

  verify-android:
    name: Android native debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build Android-safe web bundle
        run: npm run build:android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Verify Android configuration
        run: npm run verify:android-config

      - name: Verify Android Gradle configuration
        run: npm run verify:android-gradle

      - name: Verify Android branding
        run: npm run verify:android-branding

      - name: Verify Android native readiness
        run: npm run verify:android-native

      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

  verify-functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        run: npm ci

      - name: Build functions
        run: npm run build
