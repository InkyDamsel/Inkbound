name: Verify Inkbound

on:
  push:
    branches:
      - design/quiet-shelf-dashboard
      - main
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-web:
    name: Web application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Critical reading regressions
        run: npm run test:critical

      - name: Production build
        run: npm run build

      - name: Verify public release pages and mobile app artifacts
        run: npm run verify:release-artifacts

  verify-functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        run: npm ci

      - name: Build functions
        run: npm run build
