name: Series Detective branch verification
on:
  push:
    branches:
      - fix/series-detective-cross-catalog-hardening-2026-11-17
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:series:integration
      - run: npm run build:bundle
