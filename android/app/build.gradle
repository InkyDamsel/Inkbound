apply plugin: 'com.android.application'

def releaseRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains('release')
}

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def firstEnvironmentValue = { List<String> names ->
    names.collect { System.getenv(it)?.trim() }.find { it }
}

def releaseStorePassword = keystoreProperties['storePassword']?.toString()?.trim() ?: firstEnvironmentValue([
    'INKBOUND_STORE_PASSWORD',
    'INKBOUND_UPLOAD_STORE_PASSWORD',
    'ANDROID_STORE_PASSWORD',
    'KEYSTORE_PASSWORD',
])
def releaseKeyPassword = keystoreProperties['keyPassword']?.toString()?.trim() ?: firstEnvironmentValue([
    'INKBOUND_KEY_PASSWORD',
    'INKBOUND_UPLOAD_KEY_PASSWORD',
    'ANDROID_KEY_PASSWORD',
    'KEY_PASSWORD',
])
def releaseStoreFile = keystoreProperties['storeFile']?.toString()?.trim()
def releaseKeyAlias = keystoreProperties['keyAlias']?.toString()?.trim()

def hasReleaseSigningConfig = releaseStoreFile && releaseKeyAlias && releaseStorePassword && releaseKeyPassword

if (releaseRequested && !hasReleaseSigningConfig) {
    throw new GradleException('Inkbound release signing is incomplete. android/keystore.properties must contain storeFile and keyAlias. Passwords may be stored in that ignored local file as storePassword/keyPassword or supplied through the supported signing environment variables.')
}

android {
    namespace = "com.inkydameinteractive.inkbound"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.inkydameinteractive.inkbound"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2807
        versionName "28.0.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigningConfig) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.android.billingclient:billing:9.1.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}


def verifyInkboundWebBundle = tasks.register('verifyInkboundWebBundle', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'scripts/verify-android-web-bundle-fresh.mjs'
}

tasks.matching { task ->
    task.name == 'preReleaseBuild'
}.configureEach {
    dependsOn verifyInkboundWebBundle
}

apply from: 'capacitor.build.gradle'

def servicesJSON = file('google-services.json')
def hasFirebaseAndroidConfig = servicesJSON.exists() && servicesJSON.text?.trim()

if (hasFirebaseAndroidConfig) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.lifecycle('Inkbound Android: google-services.json is not installed. Firebase native Auth/App Check will be unavailable.')
    if (releaseRequested) {
        throw new GradleException('Inkbound release builds require android/app/google-services.json. Download it from the Firebase Android app configuration before building an AAB/APK.')
    }
}
