<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Inkbound is a private personal reading journal and library tracker for books, reading sessions, imports, collections, goals, memories, and reading insights." />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#120817" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4eee8" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Inkbound" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="Inkbound" />
    <meta name="format-detection" content="telephone=no" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Inkbound" />
    <meta property="og:title" content="Inkbound — Your Personal Reading Journal" />
    <meta property="og:description" content="Keep your library, reading sessions, progress, collections, goals, memories, and insights together in one private reading home." />
    <meta property="og:image" content="/assets/branding/pwa/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Inkbound — Your Personal Reading Journal" />
    <meta name="twitter:description" content="A private reading journal and library tracker built for the books you actually live with." />
    <meta name="twitter:image" content="/assets/branding/pwa/icon-512.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/branding/favicons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/branding/favicons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/branding/pwa/apple-touch-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem('inkbound_theme') === 'light' ? 'light' : 'dark';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.classList.add('dark');
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
    <title>Inkbound — Your Personal Reading Journal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Lora:ital,wght@0,400..700;1,400..700&family=Playfair+Display:ital,wght@0,400..800;1,400..800&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#120817] text-[#f4efe6] antialiased selection:bg-[#76566d]/30 selection:text-[#f4efe6]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
